# The compressed versions of each model. Every setting names a `family` (used for the
# equal-accuracy-loss comparison) and a `severity` (monotone within its family).
# Weight-space compression is simulated: compressed values are written back into
# ordinary fp16 weights (see crs.compress.apply). KV-cache settings need the HF backend.
#
# Layers compressed: every nn.Linear inside the decoder blocks (q/k/v/o, gate/up/down).
# Embeddings and lm_head are left in full precision, as is standard.
settings:
  - {name: base,          family: none,   severity: 0, backend: vllm}

  # Weight quantization (round-to-nearest, asymmetric min-max)
  - {name: rtn-w4-g128,   family: wquant-g128, severity: 1, backend: vllm, weight: {method: rtn, bits: 4, group_size: 128}}
  - {name: rtn-w3-g128,   family: wquant-g128, severity: 2, backend: vllm, weight: {method: rtn, bits: 3, group_size: 128}}
  - {name: rtn-w4-pc,     family: wquant-pc,   severity: 1, backend: vllm, weight: {method: rtn, bits: 4, group_size: -1}}
  - {name: rtn-w3-pc,     family: wquant-pc,   severity: 2, backend: vllm, weight: {method: rtn, bits: 3, group_size: -1}}
  # AWQ (compress/awq.py): activation-aware scales and clipping before the same rounding. Lotfi et al.
  # used AWQ W3 calibrated on Pile general text (AutoAWQ's recipe, 128 x 512 tokens), so the main AWQ
  # settings do the same (decided 2026-11-26). awq-w3-g128-ind calibrates on the full-size model's own
  # reasoning chains instead, to show how much the calibration text matters.
  - {name: awq-w4-g128,     family: wquant-awq,     severity: 1, backend: vllm, weight: {method: awq, bits: 4, group_size: 128, calib: pile}}
  - {name: awq-w3-g128,     family: wquant-awq,     severity: 2, backend: vllm, weight: {method: awq, bits: 3, group_size: 128, calib: pile}}
  - {name: awq-w3-g128-ind, family: wquant-awq-ind, severity: 2, backend: vllm, weight: {method: awq, bits: 3, group_size: 128, calib: baseline_chains}}

  # Unstructured pruning (Wanda: |W| * ||X||, per output row)
  - {name: wanda-10,      family: wanda, severity: 0.1, backend: vllm, weight: {method: wanda, sparsity: 0.1}}
  - {name: wanda-20,      family: wanda, severity: 0.2, backend: vllm, weight: {method: wanda, sparsity: 0.2}}
  - {name: wanda-30,      family: wanda, severity: 0.3, backend: vllm, weight: {method: wanda, sparsity: 0.3}}
  - {name: wanda-40,      family: wanda, severity: 0.4, backend: vllm, weight: {method: wanda, sparsity: 0.4}}
  - {name: wanda-50,      family: wanda, severity: 0.5, backend: vllm, weight: {method: wanda, sparsity: 0.5}}
  # Magnitude pruning at one level, as a calibration-free pruning control
  - {name: mag-30,        family: magnitude, severity: 0.3, backend: vllm, weight: {method: magnitude, sparsity: 0.3}}

  # Low-rank truncation: keep a fraction of each matrix's full rank. Plain SVD at 80% left R1 with
  # 0% accuracy and garbage text (2026-11-22). The asvd-* settings scale by activation size first
  # (compress/lowrank.py). The calibration run picks which levels the study uses.
  - {name: svd-r95,       family: lowrank, severity: 0.05, backend: vllm, weight: {method: svd, rank_frac: 0.95}}
  - {name: svd-r90,       family: lowrank, severity: 0.10, backend: vllm, weight: {method: svd, rank_frac: 0.90}}
  - {name: svd-r80,       family: lowrank, severity: 0.20, backend: vllm, weight: {method: svd, rank_frac: 0.80}}
  - {name: svd-r70,       family: lowrank, severity: 0.30, backend: vllm, weight: {method: svd, rank_frac: 0.70}}
  - {name: asvd-r95,      family: lowrank, severity: 0.05, backend: vllm, weight: {method: asvd, rank_frac: 0.95, alpha: 0.5}}
  - {name: asvd-r90,      family: lowrank, severity: 0.10, backend: vllm, weight: {method: asvd, rank_frac: 0.90, alpha: 0.5}}
  - {name: asvd-r85,      family: lowrank, severity: 0.15, backend: vllm, weight: {method: asvd, rank_frac: 0.85, alpha: 0.5}}
  - {name: asvd-r80,      family: lowrank, severity: 0.20, backend: vllm, weight: {method: asvd, rank_frac: 0.80, alpha: 0.5}}

  # KV-cache quantization, KIVI-style fake-quant (HF backend): keys per channel over blocks of
  # 32 tokens, values per token in groups of 32 channels, newest 128 tokens kept full precision.
  # Per-token keys (the first version) made int4 output gibberish, see compress/kvcache.py.
  - {name: kv-int8,       family: kvquant, severity: 1, backend: hf, kv: {bits: 8, group_size: 32, key_group: 32, residual: 128}}
  - {name: kv-int4,       family: kvquant, severity: 2, backend: hf, kv: {bits: 4, group_size: 32, key_group: 32, residual: 128}}
  - {name: kv-int2,       family: kvquant, severity: 3, backend: hf, kv: {bits: 2, group_size: 32, key_group: 32, residual: 128}}

  # Combined setting
  - {name: combo-w4-kv4,  family: combo, severity: 1, backend: hf, weight: {method: rtn, bits: 4, group_size: 128}, kv: {bits: 4, group_size: 32, key_group: 32, residual: 128}}

  # Control (not one of the 18): uncompressed model on the HF backend, the paired
  # reference for the KV-cache settings so backend numerics don't masquerade as an effect.
  - {name: base-hf,       family: none-hf, severity: 0, backend: hf}

# Wanda calibration data
calibration:
  source: baseline_chains     # baseline_chains | wikitext
  n_samples: 128
  seq_len: 2048
