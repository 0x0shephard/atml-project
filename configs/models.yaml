# Models under study. `dtype` is the precision used for generation; T4 GPUs have no
# bf16, so float16 is the default. If the smoke test shows NaN/inf logits for a model,
# switch that model to float32 (both 1.5B/1.7B fit on a 16 GB T4 in fp32).
models:
  r1-1.5b:
    hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    family: r1-distill
    dtype: float16
    think_end: "</think>"
    chat_template_kwargs: {}
    sampling: {temperature: 0.6, top_p: 0.95, top_k: -1}
    hf_batch_size: 40       # HF backend (KV settings); 2 KV heads -> small cache (40 x 8.4k tok ~ 9.4 GB)

  qwen3-1.7b:
    hf_id: Qwen/Qwen3-1.7B
    family: qwen3-thinking
    dtype: float16
    think_end: "</think>"
    chat_template_kwargs: {enable_thinking: true}
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20}
    hf_batch_size: 8        # 8 KV heads -> 4x the cache per sequence

  # Local CPU tests only: a tiny randomly initialised Qwen2 model is built on the fly
  # (see tests/conftest.py) and paired with the R1-distill tokenizer.
  tiny:
    hf_id: null
    tokenizer_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    family: test
    dtype: float32
    think_end: "</think>"
    chat_template_kwargs: {}
    sampling: {temperature: 1.0, top_p: 1.0, top_k: -1}
    hf_batch_size: 4

# Instruction appended to every problem (DeepSeek-R1 recommended math prompt).
prompt_suffix: "\nPlease reason step by step, and put your final answer within \\boxed{}."

generation:
  max_tokens: 8192          # total new tokens (thinking + answer)
  logprobs_k: 20            # top-k logprobs kept per token for the entropy estimate
  seed: 1234
  chunk_size: 180           # problems per write-out chunk, vLLM. 64 left the GPU idle while each
                            # chunk's slowest chain finished (~300 tok/s vs 630 in the bench).
  chunk_size_hf: 80         # same for the HF backend (KV settings): 2 batches of 40 for R1
  # vLLM runs stream (2026-11-24): every problem goes to the engine at once and each chain is saved
  # as it ends, so chunk_size only applies to the HF backend and to sampling n > 1. Finished chains
  # are written out every save_every chains or save_every_s seconds, whichever comes first.
  save_every: 20
  save_every_s: 300
  # stop a chain once the same 64 tokens have been written 8 times (crs.decoding.loops); it is
  # saved with finish_reason "loop" and scored like a cut-off chain. false turns it off.
  loop_stop: {window: 64, repeats: 8, lookback: 8192, every: 256}
  vllm_attention_backend: TRITON_ATTN  # 2026-11-21 bench on T4: the only one that works. FlexAttention (vLLM's
                                      # default) runs out of memory mid-run; xFormers has no T4 kernel.
