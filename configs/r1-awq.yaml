# AWQ on R1 (planned 2026-11-25, for after the 28 Nov quota reset). Lotfi et al. saw the "had the
# answer, then dropped it" share of errors rise from 26% to 52% under AWQ W3; our plain-rounding W3
# stayed flat (~25%, even at 32k). These runs use the same method they did, so the two results can
# be compared like-for-like. compress/awq.py builds the checkpoint at the start of each job (a few
# minutes on a T4, calibrated on 128 x 512 tokens of R1's own base chains).
#
# Session 1 (HOURS ~4, both GPUs): the two 8k main runs, each ~2-3 h, then the forced-answer step
#   for both (POST_HOURS 1.2).
# Session 2: the 32k extend of AWQ W3's cut-off chains on MATH-500, run only after session 1 is
#   pulled, since it continues those chains. W4 is extended too if the W3 extend leaves time.
groups:
  - name: r1-awq-main
    models: [r1-1.5b]
    settings: [awq-w3-g128, awq-w4-g128]
    fix: none

  - name: r1-awq-extend
    kind: extend
    models: [r1-1.5b]
    settings: [awq-w3-g128, awq-w4-g128]
    max_tokens: 32768
    problems: problems_math500.jsonl
    results: results-32k-ext
    chunk_size: 20
